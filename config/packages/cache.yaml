framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Single container (web + worker share the same filesystem), nothing here needs
        # cross-host sharing or pub/sub -- plain disk is simpler than depending on a Redis
        # instance that has to be separately provisioned and kept reachable.
        app: cache.adapter.filesystem

#         Redis (only worth it again if lingua ever needs cross-instance cache sharing)
#        app: cache.adapter.redis
#        default_redis_provider: '%env(REDIS)%'
#        app: cache.adapter.redis_taggable

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Namespaced pools use the above "app" backend by default
        #pools:
            #my.dedicated.cache: null
        pools:
            # control adapter's configuration
            translation.cache:
                adapter: cache.adapter.pdo
                provider: '%env(TRANSLATION_CACHE_DSN)%'
            scraper.cache:
                adapter: cache.adapter.pdo
                provider: '%env(SCRAPER_CACHE_DSN)%'
